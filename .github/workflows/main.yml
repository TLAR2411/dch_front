name: DCH-Deploy-Action

on:
  push:
    branches:
      - main
    paths:
      - "WEB/**"
      - ".github/workflows/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: WEB

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: WEB/package-lock.json

      - name: Check Node Version
        run: |
          node -v
          npm -v

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Create .env
        run: |
          echo "VITE_APP_NAME=DEWEY DEVELOPER" > .env
          echo "VITE_APP_TITLE_NAME=ប្រព័ន្ធគ្រប់គ្រង" >> .env
          echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" >> .env
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" >> .env
          echo "VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}" >> .env
          echo "VITE_CLIENT_ID=${{ secrets.VITE_CLIENT_ID }}" >> .env
          echo "VITE_FORCE_HMR=false" >> .env

      - name: Verify ENV
        run: |
          echo "Checking ENV..."
          grep '^VITE_API_URL=' .env
          grep '^VITE_SUPABASE_URL=' .env
          grep '^VITE_SUPABASE_PUBLISHABLE_KEY=' .env | sed 's/=.*/=***HIDDEN***/'

      - name: Build WEB
        run: npm run build

      - name: Verify Build
        run: |
          test -f dist/index.html
          echo "Build OK"
          du -sh dist

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftp

          local-dir: WEB/dist/
          server-dir: /

          timeout: 180000
          log-level: minimal

          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
            **/.htaccess
