name: DCH-Deploy-Action

on:
  push:
    branches: [main]
    paths:
      - "WEB/**"
      - ".github/workflows/main.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: WEB

    steps:

      # ==========================================
      # Checkout
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # Node.js
      # ==========================================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: WEB/package-lock.json


      # ==========================================
      # Node Version
      # ==========================================
      - name: Check Node Version
        run: |
          echo "Node:"
          node -v

          echo "NPM:"
          npm -v


      # ==========================================
      # Install
      # ==========================================
      - name: Install Dependencies
        run: npm ci --legacy-peer-deps


      # ==========================================
      # Check Required GitHub Secrets
      # ==========================================
      - name: Check Required ENV
        run: |
          echo "Checking required environment variables..."

          [ -n "${{ secrets.VITE_API_URL }}" ] || {
            echo "❌ Missing VITE_API_URL"
            exit 1
          }

          [ -n "${{ secrets.VITE_SUPABASE_URL }}" ] || {
            echo "❌ Missing VITE_SUPABASE_URL"
            exit 1
          }

          [ -n "${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" ] || {
            echo "❌ Missing VITE_SUPABASE_PUBLISHABLE_KEY"
            exit 1
          }

          [ -n "${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}" ] || {
            echo "❌ Missing VITE_GOOGLE_MAPS_API_KEY"
            exit 1
          }

          [ -n "${{ secrets.VITE_CLIENT_ID }}" ] || {
            echo "❌ Missing VITE_CLIENT_ID"
            exit 1
          }

          echo "✅ All required ENV variables exist"


      # ==========================================
      # Create Production .env
      # ==========================================
      - name: Create Production ENV
        run: |
          printf '%s\n' \
            'VITE_APP_NAME=DEWEY DEVELOPER' \
            'VITE_APP_TITLE_NAME=ប្រព័ន្ធគ្រប់គ្រង' \
            'VITE_API_URL=${{ secrets.VITE_API_URL }}' \
            'VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}' \
            'VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}' \
            'VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}' \
            'VITE_CLIENT_ID=${{ secrets.VITE_CLIENT_ID }}' \
            'VITE_FORCE_HMR=false' \
            > .env


      # ==========================================
      # Check ENV file
      # Do NOT print secret values
      # ==========================================
      - name: Verify ENV File
        run: |
          echo "Checking ENV..."

          grep '^VITE_APP_NAME=' .env
          grep '^VITE_APP_TITLE_NAME=' .env

          grep '^VITE_API_URL=' .env \
            | sed 's/=.*/=***HIDDEN***/'

          grep '^VITE_SUPABASE_URL=' .env \
            | sed 's/=.*/=***HIDDEN***/'

          grep '^VITE_SUPABASE_PUBLISHABLE_KEY=' .env \
            | sed 's/=.*/=***HIDDEN***/'

          grep '^VITE_GOOGLE_MAPS_API_KEY=' .env \
            | sed 's/=.*/=***HIDDEN***/'

          grep '^VITE_CLIENT_ID=' .env \
            | sed 's/=.*/=***HIDDEN***/'

          echo "✅ ENV file created successfully"


      # ==========================================
      # Build
      # ==========================================
      - name: Build WEB
        run: npm run build


      # ==========================================
      # Check dist
      # ==========================================
      - name: Check Build Output
        run: |
          echo "Checking dist..."

          if [ ! -d "dist" ]; then
            echo "❌ dist directory does not exist"
            exit 1
          fi

          if [ ! -f "dist/index.html" ]; then
            echo "❌ dist/index.html does not exist"
            exit 1
          fi

          echo "Build size:"
          du -sh dist

          echo "Total files:"
          find dist -type f | wc -l

          echo "✅ Build completed successfully"


      # ==========================================
      # Verify Supabase URL compiled into Vite
      # ==========================================
      - name: Verify Production Supabase Config
        run: |
          echo "Checking compiled Supabase configuration..."

          if grep -R -q "wwwpqgeixvwpuwsevyxj.supabase.co" dist; then
            echo "✅ Correct Supabase URL found in production build"
          else
            echo "❌ Correct Supabase URL NOT found in production build"
            echo "Check VITE_SUPABASE_URL or application configuration."
            exit 1
          fi


      # ==========================================
      # Make sure old malformed URL isn't present
      # ==========================================
      - name: Check For Old Supabase URL
        run: |
          echo "Checking for malformed Supabase URL..."

          if grep -R -q "www.pqgeixvwpuwsevyxj.supabase.co" dist; then
            echo "❌ Old/malformed Supabase URL found!"
            exit 1
          fi

          echo "✅ No malformed Supabase URL found"


      # ==========================================
      # FTP Deploy
      # ==========================================
      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}

          protocol: ftp

          local-dir: WEB/dist/
          server-dir: /

          timeout: 180000

          log-level: minimal

          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
            **/.htaccess
