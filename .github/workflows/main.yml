name: DCH-Deploy-Action

on:
  push:
    branches: [main]
    paths:
      - "WEB/**"
      - ".github/workflows/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: WEB

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: WEB/package-lock.json

      - name: Check Node Version
        run: |
          node -v
          npm -v

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Create WEB .env
        run: |
          cat > .env <<EOF
          VITE_APP_NAME="DEWEY DEVELOPER"
          VITE_APP_TITLE_NAME="ប្រព័ន្ធគ្រប់គ្រង"

          VITE_API_URL=${{ secrets.VITE_API_URL }}

          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

          VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

          VITE_CLIENT_ID=${{ secrets.VITE_CLIENT_ID }}

          VITE_FORCE_HMR=false
          EOF

      - name: Verify Required ENV
        run: |
          test -n "${{ secrets.VITE_API_URL }}"
          test -n "${{ secrets.VITE_SUPABASE_URL }}"
          test -n "${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}"
          test -n "${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}"
          test -n "${{ secrets.VITE_CLIENT_ID }}"

      - name: Build WEB
        run: npm run build

      - name: Check Build Output
        run: |
          test -f dist/index.html
          echo "Build OK"
          du -sh dist
          find dist -type f | wc -l

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftp
          local-dir: WEB/dist/
          server-dir: /
          timeout: 180000
          log-level: minimal
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
            **/.htaccess
